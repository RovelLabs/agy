<!DOCTYPE html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sequence Not Found | OPERON</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg-0: #0a0c0e;
      --bg-1: #121518;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #38bdf8;
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      color: var(--text-1);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--bg-1);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: opacity 150ms ease;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 // UNMAPPED VECTOR</div>
    <h1>404</h1>
    <p>The requested operating sequence or resource does not exist in the OPERON dispatch matrix.</p>
    <a href="/" class="btn">Return to Command Layer &rarr;</a>
  </div>
</body>
</html>
