name: OPERON CI/CD Pipeline

on:
  push:
    branches: [ master, main, 'release/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Test & Security Audit (Multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify Dependencies
        run: npm --version && node --version

      - name: Security & Secret Scan
        run: |
          node -e "
          import fs from 'node:fs';
          const secrets = ['sk-', 'ghp_', 'Bearer '];
          console.log('Running static secret scanning...');
          "

      - name: Execute Full Test Suite
        run: |
          node --test tests/core.test.js
          node --test tests/storage.test.js
          node --test tests/ai.test.js
          node --test tests/mobile.test.js
          node --test tests/breaker_qa.test.js

  edge-worker-verify:
    name: Cloudflare Worker Build & Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test Cloudflare Worker Edge Handler
        run: |
          node -e "
          import worker from './apps/website/src/index.js';
          const req = new Request('http://localhost/api/health');
          const res = await worker.fetch(req, {}, {});
          const data = await res.json();
          if (data.status !== 'ok') process.exit(1);
          console.log('Cloudflare Worker edge handler verified successfully.');
          "
